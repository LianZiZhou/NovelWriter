name: Desktop app

on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: &paths
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      release_tag:
        description: Attach the installers to this existing release (e.g. v0.0.1); leave empty for a test build
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Where the installers go and which version they carry:
  #   push to main  -> a release tagged with the short commit hash, version <major>.<minor>.<run number>
  #   v* tag        -> that tag's release, version from the tag (v1.2.3 -> 1.2.3)
  #   manual run    -> the existing release named in `release_tag`, if any
  #   anything else -> no release; installers kept as workflow artifacts
  meta:
    name: Release info
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: apps/desktop/package.json
          sparse-checkout-cone-mode: false
      - id: meta
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          tag='' version=''
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"; version="${tag#v}"
          elif [[ "$EVENT" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            tag="${GITHUB_SHA::7}"
            base=$(node -p "require('./apps/desktop/package.json').version.split('.').slice(0, 2).join('.')")
            version="$base.$RUN_NUMBER"
          elif [[ "$EVENT" == workflow_dispatch && -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"; [[ "$tag" == v* ]] && version="${tag#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-none}, app version: ${version:-from package.json}"

  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Create the release once, then each platform uploads its installers to it directly (no
  # artifact storage, so the account's artifact quota can't block a release). A manual run only
  # fills a release that already exists.
  release:
    name: Create GitHub Release
    if: needs.meta.outputs.tag != '' && github.event_name == 'push'
    needs: [meta, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
          make_latest: ${{ !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}

  build:
    name: Build (${{ matrix.os }})
    needs: [meta, test, release]
    # Runs when the release job was skipped (branch/PR builds) but not when it failed.
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.test.result == 'success' && needs.release.result != 'failure' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Signing is optional. Without certificates macOS builds are ad-hoc signed and Windows
      # builds are unsigned, and electron-builder must not go looking for an identity.
      # Secrets (all optional): MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD (Developer ID .p12, base64),
      # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization),
      # WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD (Authenticode .pfx, base64).
      - name: Configure code signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # NAME<<DELIMITER form so multi-line values are safe in $GITHUB_ENV.
          put() { d="EOF_$(openssl rand -hex 8)"; printf '%s<<%s\n%s\n%s\n' "$1" "$d" "$2" "$d" >> "$GITHUB_ENV"; }
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CSC_LINK" ]; then
            put CSC_LINK "$MAC_CSC_LINK"
            put CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
            if [ -n "$APPLE_ID" ]; then
              put APPLE_ID "$APPLE_ID"
              put APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD"
              put APPLE_TEAM_ID "$APPLE_TEAM_ID"
            fi
          elif [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CSC_LINK" ]; then
            put WIN_CSC_LINK "$WIN_CSC_LINK"
            put WIN_CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD"
          else
            echo "No signing certificate for $RUNNER_OS: building unsigned (macOS: ad-hoc signed)."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      - name: Build installers
        shell: bash
        env:
          NOVELWRITER_VERSION: ${{ needs.meta.outputs.version }}
        run: npm run desktop:dist

      - name: Smoke test the packaged app
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke -w @novelwriter/desktop -- "$PWD/apps/desktop/release/linux-unpacked/novelwriter"

      - name: List installers
        shell: bash
        # Actions runs bash with -eo pipefail: count matches instead of piping ls, which fails
        # whenever one of the patterns has no match on this platform.
        run: |
          shopt -s nullglob
          files=(apps/desktop/release/*.{exe,dmg,zip,AppImage,deb})
          (( ${#files[@]} )) || { echo "no installers built"; exit 1; }
          ls -la "${files[@]}"

      - name: Attach installers to the release
        if: needs.meta.outputs.tag != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

      # Branch and PR builds keep the installers for a few days for testing. A full artifact
      # quota must not fail the build, which has already been checked above.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.meta.outputs.tag == ''
        continue-on-error: true
        with:
          name: novelwriter-${{ runner.os }}
          retention-days: 3
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
